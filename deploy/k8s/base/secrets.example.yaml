# EXAMPLE ONLY - this file is not referenced by any kustomization and must
# never be applied as-is.
#
# It documents the keys of the aex-secrets Secret that the manifests in
# deploy/k8s reference. No overlay renders this Secret: create it in the
# target namespace BEFORE 'kubectl apply -k', and 'kubectl apply -k' will
# leave it untouched.
#
# Recommended (generates random values, keeps existing ones on re-run, and
# also creates the mongodb-keyfile Secret the MongoDB StatefulSet mounts):
#
#   ANTHROPIC_API_KEY=sk-ant-... ./deploy/k8s/create-secrets.sh
#
# Manual equivalent:
#
#   MONGO_USERNAME=aex-admin
#   MONGO_PASSWORD="$(openssl rand -hex 24)"
#   kubectl create secret generic aex-secrets --namespace aex \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=JWT_SIGNING_KEY="$(openssl rand -base64 48)" \
#     --from-literal=WEBHOOK_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=MONGO_USERNAME="$MONGO_USERNAME" \
#     --from-literal=MONGO_PASSWORD="$MONGO_PASSWORD" \
#     --from-literal=MONGO_URI="mongodb://$MONGO_USERNAME:$MONGO_PASSWORD@mongodb.aex.svc.cluster.local:27017/?authSource=admin" \
#     --from-literal=AEX_API_KEY="<api key issued by aex-identity>" \
#     --from-literal=ANTHROPIC_API_KEY="<your Anthropic API key>"
#
# For shared clusters prefer an external secret manager (External Secrets
# Operator with AWS Secrets Manager / GCP Secret Manager / Vault, Sealed
# Secrets, or SOPS) that produces a Secret with the same name and keys.
apiVersion: v1
kind: Secret
metadata:
  name: aex-secrets
  namespace: aex
  labels:
    app.kubernetes.io/part-of: agent-exchange
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # HS256 key the gateway uses to verify JWTs. Must be random and at least
  # 32 bytes; anyone who knows it can mint tokens for any tenant and scope.
  JWT_SECRET: "<generate: openssl rand -base64 48>"

  # Signing key passed to aex-identity. Random, at least 32 bytes.
  JWT_SIGNING_KEY: "<generate: openssl rand -base64 48>"

  # HMAC key for webhook payload signatures. Random, at least 32 bytes.
  WEBHOOK_SECRET: "<generate: openssl rand -base64 48>"

  # MongoDB root credentials for the in-cluster StatefulSet. MongoDB reads
  # them only when its data volume is first initialised.
  MONGO_USERNAME: "<username, e.g. aex-admin>"
  MONGO_PASSWORD: "<generate: openssl rand -hex 24>"

  # Must embed the same credentials as MONGO_USERNAME / MONGO_PASSWORD (or
  # point at an external MongoDB with its own credentials).
  MONGO_URI: "mongodb://<MONGO_USERNAME>:<MONGO_PASSWORD>@mongodb.aex.svc.cluster.local:27017/?authSource=admin"

  # API key the demo agents present to the gateway (issued by aex-identity).
  AEX_API_KEY: "<api key issued by aex-identity>"

  # Anthropic API key for the Claude-powered code review agents.
  ANTHROPIC_API_KEY: "<your Anthropic API key>"
